name: Update blog index

on:
  schedule:
    # GitHub Actions cron uses UTC. 15:00 UTC is 00:00 KST.
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-blog-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update pages from Naver RSS
        run: python scripts/update_index.py

      - name: Commit updated index
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No blog changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml posts/
          git commit -m "Update blog index"
          git push
